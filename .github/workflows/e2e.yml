# End-to-end tests in the real game with two programs talking over the network (see ci/gallery.sh):
#   e2e-vanilla:  a player WITHOUT the mod joins a NeoForge 1.21.1 server WITH it: /find, chat answers, glow
#                 through walls (and none next to the player), help, name and tag search, range limit message.
#   e2e-noserver: a player WITH the mod joins a server WITHOUT it: the search screen says so, settings open.
# Results (SRTEST lines) go to branch "e2e-results".
name: End-to-end (mod missing on one side)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['common/**', 'neoforge/**', 'ports/src/**', 'ci/gallery.sh', '.github/workflows/e2e.yml']

permissions:
  contents: write

env:
  MC: "1.21.1"
  LOGICLIB: "0.1.0"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [e2e-vanilla, e2e-noserver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: LogicLib (read-only dependency)
        run: |
          mkdir -p libs
          for l in forge neoforge; do
            curl -fsSL -o "libs/logiclib-$l-${MC}-${LOGICLIB}.jar" "https://raw.githubusercontent.com/CosmicLogic0/logiclib/dist/logiclib-$l-${MC}-${LOGICLIB}.jar"
          done
      - name: Root project = ports code for 1.21.1
        run: python3 ci/sync-root.py
      - name: Build Stash Radar (NeoForge 1.21.1) + the screenshot helper
        run: |
          chmod +x gradlew
          ./gradlew :neoforge:build :neoforge:pageshotsJar -x test --no-daemon -q
          ls -la neoforge/build/libs neoforge/build/pageshots
      - name: Virtual screen, software OpenGL, launcher
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libopenal1 imagemagick > /dev/null
          pip install -q portablemc
      - name: Run (${{ matrix.mode }})
        run: |
          set +e
          bash ci/gallery.sh ${{ matrix.mode }} out; rc=$?
          grep -h "SRTEST" out/*-latest.log out/*-game.log 2>/dev/null | sed -E 's/^.*SRTEST/SRTEST/' | sort -u > out/${{ matrix.mode }}-results.txt
          cat out/${{ matrix.mode }}-results.txt
          if [ $rc -eq 0 ]; then echo "PASS" >> out/${{ matrix.mode }}-results.txt; else echo "FAIL" >> out/${{ matrix.mode }}-results.txt; fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.mode }}
          path: out/

  save:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          merge-multiple: true
          path: out
      - name: Push to e2e-results
        run: |
          cd out
          echo "${GITHUB_SHA}" > COMMIT
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > RUN
          git init -q -b e2e-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "e2e ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" e2e-results
