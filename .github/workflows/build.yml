name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MC: "1.21.1"
  LOGICLIB: "0.1.0"   # read-only dependency, taken from CosmicLogic0/logiclib branch "dist"
  FORGE: "1.21.1-52.0.28"
  NEOFORGE: "21.1.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Get LogicLib jars (read-only dependency)
        run: |
          mkdir -p libs
          for l in forge neoforge; do
            curl -fsSL -o "libs/logiclib-$l-${MC}-${LOGICLIB}.jar" "https://raw.githubusercontent.com/CosmicLogic0/logiclib/dist/logiclib-$l-${MC}-${LOGICLIB}.jar"
          done
      - name: Build Forge + NeoForge jars
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: stashradar-jars
          path: |
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar

  # Starts a real dedicated server with Stash Radar + LogicLib, runs the in-game self-test
  # (real chests, barrels and shulker boxes are filled and searched) and checks the log.
  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: stashradar-jars
          path: jars
      - name: Install ${{ matrix.loader }} server
        run: |
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
            java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          else
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE}/neoforge-${NEOFORGE}-installer.jar"
            java -jar installer.jar --install-server . > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          ls
          find ../jars -name "stashradar-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} mods/ \;
          curl -fsSL -o "mods/logiclib-${{ matrix.loader }}-${MC}-${LOGICLIB}.jar" "https://raw.githubusercontent.com/CosmicLogic0/logiclib/dist/logiclib-${{ matrix.loader }}-${MC}-${LOGICLIB}.jar"
          ls mods
      - name: Start server and check Stash Radar
        run: |
          chmod +x ci/server-test.sh server/run.sh
          LOADER_NAME=$([ "${{ matrix.loader }}" = "forge" ] && echo Forge || echo NeoForge)
          TEST_COMMANDS="stashradar selftest" ci/server-test.sh server \
            "LogicLib loaded on ${LOADER_NAME}" \
            "Stash Radar loaded on ${LOADER_NAME}" \
            "Stash Radar self-test PASSED" \
            -- bash run.sh nogui

  # Starts the real Minecraft CLIENT (headless), joins a singleplayer world and quits.
  client-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stashradar-jars
          path: jars
      - name: Put Stash Radar + LogicLib in run/mods
        run: |
          mkdir -p run/mods
          find jars -name "stashradar-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} run/mods/ \;
          curl -fsSL -o "run/mods/logiclib-${{ matrix.loader }}-${MC}-${LOGICLIB}.jar" "https://raw.githubusercontent.com/CosmicLogic0/logiclib/dist/logiclib-${{ matrix.loader }}-${MC}-${LOGICLIB}.jar"
          ls run/mods
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.21.1"
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: 21

  # After every test passes: print each jar's checksum and base64 so Claude
  # (whose workspace can't download artifacts) can take the exact tested jar.
  export:
    needs: [server-test, client-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stashradar-jars
          path: jars
      - name: Print tested jars
        run: |
          for f in $(find jars -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort); do
            echo "JAR $(basename $f) $(stat -c%s $f) $(sha256sum $f | cut -d' ' -f1)"
            echo "B64BEGIN $(basename $f)"; base64 -w 4000 $f; echo "B64END"
          done
