pluginManagement {
    repositories {
        maven {
            // RetroFuturaGradle (same as CleanroomMC's 1.12.2 template)
            name 'GTNH Maven'
            url 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent { includeGroup 'com.gtnewhorizons'; includeGroup 'com.gtnewhorizons.retrofuturagradle' }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'stashradar-forge-1.12.2'
