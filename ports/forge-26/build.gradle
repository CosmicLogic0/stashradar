// Stash Radar for Forge (ForgeGradle 7) on Minecraft 26.x. Same code as every other version: ../src/common + ../src/forge with //#if blocks.
// Build setup copied from CosmicLogic0/logiclib ports/forge-26 (originally villager-reroller).
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

apply from: '../shared.gradle'
def mcv = project.minecraft_version as String
version = "${project.mod_version}"
group = 'com.cosmiclogic.stashradar'
base { archivesName = "stashradar-forge-${mcv}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach { workingDir = layout.projectDirectory.dir('run') }
        register('client')
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mcv}-${project.forge_version}")
    // LogicLib (read-only). CI puts the released jar for this version in ../../libs/.
    compileOnly files(rootProject.file("../../libs/logiclib-forge-${mcv}-${project.logiclib_version}.jar"))
}

def gen = layout.buildDirectory.dir('gen-src').get().asFile
def ctx = [mc: mcv, FABRIC: false, FORGE: true, NEOFORGE: false, JAVA8: false, RELOCATE: false]
tasks.register('srSources') {
    inputs.dir('../src'); inputs.property('ctx', ctx.toString()); outputs.dir(gen)
    doLast { vrGenerate(['../src/forge', '../src/common'], gen, ctx) }
}
def res = layout.buildDirectory.dir('gen-res')
def mcRange = project.findProperty('mc_range') ?: "[${mcv}]"
def forgeMajor = (project.forge_version.split('\\.')[0]) as int
tasks.register('srResources', Sync) {
    from('../../common/src/main/resources') { include 'stashradar.png'; include 'assets/**' }
    from('src/res')
    from('../forge/src/res') { include 'META-INF/mods.toml' }
    into res
    def props = ['version': project.mod_version, 'mcRange': mcRange, 'loaderMajor': forgeMajor, 'loaderId': 'forge',
                 'mandatory': 'mandatory = true', 'logiclibVersion': project.logiclib_version]
    inputs.property 'v', props.toString()
    filesMatching('META-INF/mods.toml') { expand props }
}
sourceSets.main.java.srcDirs = [gen]
sourceSets.main.resources.srcDirs = [res]
compileJava.dependsOn 'srSources'
compileJava.enabled = !project.hasProperty('probe')
processResources.dependsOn 'srResources'
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'srSources', 'srResources' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }

// Prints the signatures of a few Minecraft classes (javap) so ports can be written against the real 26.x API.
tasks.register('apiProbe') {
    dependsOn 'compileJava'
    doLast {
        def cp = sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
        def javap = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get().executablePath.asFile.parentFile.toPath().resolve('javap').toString()
        (project.findProperty('probe') ?: '').toString().split(',').findAll { it }.each { cls ->
            def p = new ProcessBuilder(javap, '-cp', cp, cls).redirectErrorStream(true).start()
            println "===== ${cls}"; println p.inputStream.text; p.waitFor()
        }
    }
}
