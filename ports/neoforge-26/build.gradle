// Stash Radar for NeoForge on Minecraft 26.x (ModDevGradle). Same code as every other version: ../src/common + ../src/neoforge with //#if blocks.
// Build setup copied from CosmicLogic0/logiclib ports/neoforge-26 (originally villager-reroller).
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

apply from: '../shared.gradle'
def mcv = project.minecraft_version as String
version = "${project.mod_version}"
group = 'com.cosmiclogic.stashradar'
base { archivesName = "stashradar-neoforge-${mcv}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs { client { client() } }
    mods { stashradar { sourceSet(sourceSets.main) } }
}
dependencies {
    // LogicLib (read-only). CI puts the released jar for this version in ../../libs/.
    compileOnly files(rootProject.file("../../libs/logiclib-neoforge-${mcv}-${project.logiclib_version}.jar"))
}

def gen = layout.buildDirectory.dir('gen-src').get().asFile
def ctx = [mc: mcv, FABRIC: false, FORGE: false, NEOFORGE: true, JAVA8: false, RELOCATE: false]
tasks.register('srSources') {
    inputs.dir('../src'); inputs.property('ctx', ctx.toString()); outputs.dir(gen)
    doLast { vrGenerate(['../src/neoforge', '../src/common'], gen, ctx) }
}
def res = layout.buildDirectory.dir('gen-res')
def mcRange = project.findProperty('mc_range') ?: "[${mcv}]"
def neoMajor = (project.neo_version.split('\\.')[0]) as int
tasks.register('srResources', Sync) {
    from('../../common/src/main/resources') { include 'stashradar.png'; include 'assets/**' }
    from('src/res')
    from('../forge/src/res') { include 'META-INF/mods.toml' }
    into res
    def props = ['version': project.mod_version, 'mcRange': mcRange, 'loaderMajor': neoMajor, 'loaderId': 'neoforge',
                 'mandatory': 'type = "required"', 'logiclibVersion': project.logiclib_version]
    inputs.property 'v', props.toString()
    filesMatching('META-INF/mods.toml') { expand props }
    rename 'mods.toml', 'neoforge.mods.toml'
}
sourceSets.main.java.srcDirs = [gen]
sourceSets.main.resources.srcDirs = [res]
compileJava.dependsOn 'srSources'
processResources.dependsOn 'srResources'
tasks.matching { it.name in ['sourcesJar', 'neoForgeIdeSync'] }.configureEach { dependsOn 'srSources', 'srResources' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
